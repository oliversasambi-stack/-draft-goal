<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ultimate Goal Challenge</title>
<style>
:root{--green:#75ff6b;--cyan:#42d9ff;--dark:#071018}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,Helvetica,sans-serif;background:#03070b;color:#fff}
body{touch-action:manipulation}.app{height:100%;position:relative;overflow:hidden;background:linear-gradient(#071a2a 0 33%,#06331d 33% 100%)}
.app:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 15%,#43a5d633,transparent 38%),linear-gradient(180deg,#0000 45%,#0008);pointer-events:none}
.hud{position:absolute;top:max(12px,env(safe-area-inset-top));left:14px;right:14px;z-index:8;display:flex;align-items:center;justify-content:space-between}
.brand{font-weight:1000;font-style:italic;letter-spacing:1px;font-size:18px;text-shadow:0 2px 8px #000}.brand span{color:var(--green)}
.balance{background:#071019dd;border:1px solid #ffffff30;border-radius:18px;padding:8px 12px;font-weight:900;box-shadow:0 5px 20px #0008}.balance b{color:#ffd84d}
.stands{position:absolute;top:7%;left:0;right:0;height:29%;background:linear-gradient(#101c29,#07111b);clip-path:polygon(0 15%,100% 0,100% 100%,0 88%);opacity:.95}
.lights{position:absolute;top:8%;left:4%;right:4%;height:5px;background:#fff;box-shadow:0 0 22px 5px #b9ecff;opacity:.65}
.field{position:absolute;left:-15%;right:-15%;bottom:-8%;height:72%;transform:perspective(500px) rotateX(13deg);background:repeating-linear-gradient(90deg,#087a3c 0 62px,#096e37 62px 124px);border-top:2px solid #fff8}
.field:before{content:"";position:absolute;inset:9% 15% 8%;border:2px solid #fff5;border-radius:50%}
.goal{position:absolute;top:25%;left:50%;transform:translateX(-50%);width:min(88vw,430px);height:205px;border:6px solid #fff;border-bottom-width:8px;box-shadow:0 0 28px #bdefff99;background:#ffffff08}
.net{position:absolute;inset:0;background-image:linear-gradient(90deg,#fff3 1px,transparent 1px),linear-gradient(#fff3 1px,transparent 1px);background-size:27px 27px;opacity:.7}
.keeper{position:absolute;bottom:-9px;left:50%;transform:translateX(-50%);font-size:70px;z-index:3;transition:.25s}
.target{position:absolute;width:67px;height:67px;border-radius:50%;border:4px solid var(--green);box-shadow:0 0 24px var(--green);background:#071018aa;z-index:4;animation:pulse .9s infinite}
.target:after{content:"✦";position:absolute;left:50%;top:50%;transform:translate(-50%,-52%);font-size:28px;color:var(--green)}
@keyframes pulse{50%{transform:scale(1.08)}}
.ball{position:absolute;left:50%;bottom:14%;font-size:52px;transform:translateX(-50%);z-index:6;transition:.58s cubic-bezier(.2,.9,.25,1)}
.panel{position:absolute;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);width:92%;max-width:480px;text-align:center;z-index:9}
.tip{font-weight:800;font-size:15px;margin-bottom:10px;text-shadow:0 2px 5px #000}.bar{height:7px;background:#ffffff2b;border-radius:10px;margin:0 18px 12px;overflow:hidden}.bar i{display:block;width:100%;height:100%;background:linear-gradient(90deg,var(--cyan),var(--green))}
button{width:100%;border:0;border-radius:16px;padding:16px 20px;background:linear-gradient(135deg,#8cff72,#2adf91);color:#031008;font-size:19px;font-weight:1000;box-shadow:0 8px 28px #0008}button:active{transform:scale(.97)}
.overlay{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:22px;background:#02060bd9;backdrop-filter:blur(7px)}
.card{width:min(94vw,420px);border:1px solid #ffffff22;border-radius:25px;padding:27px 21px;background:linear-gradient(150deg,#112333,#071019);box-shadow:0 20px 70px #000b;text-align:center}
.card:before{content:"";display:block;height:3px;width:70%;margin:0 auto 20px;background:linear-gradient(90deg,transparent,var(--green),transparent)}
.kicker{font-size:12px;font-weight:900;letter-spacing:2px;color:#8d9eaa}.card h1{margin:7px 0;color:#fff;font-size:34px;font-style:italic}.card p{color:#b9c5ce;line-height:1.45}.badge{font-size:55px;margin:8px}.rewardTitle{color:var(--green);font-size:30px;font-weight:1000}.amount{font-size:40px;font-weight:1000;color:#ffd84d;margin:10px}.code{margin:13px 0;padding:12px;border-radius:11px;border:1px dashed #75ff6b88;background:#0008;color:#75ff6b;font-weight:1000;letter-spacing:2px;font-size:18px}.qr{width:180px;height:180px;margin:14px auto;background:white;border-radius:12px;padding:8px;display:flex;align-items:center;justify-content:center}.qr canvas,.qr img{max-width:100%;max-height:100%}.note{font-size:12px!important;color:#8997a2!important}.hidden{display:none!important}
</style>
</head>
<body>
<div class="app">
<div class="stands"></div><div class="lights"></div><div class="field"></div>
<div class="hud"><div class="brand">ULTIMATE <span>GOAL</span></div><div class="balance">🎟️ <span id="tickets">0</span></div></div>
<div class="goal"><div class="net"></div><div class="target" id="target"></div><div class="keeper" id="keeper">🧤</div></div>
<div class="ball" id="ball">⚽</div>
<div class="panel"><div class="tip" id="tip">¡Encuentra el objetivo y dispara!</div><div class="bar"><i></i></div><button id="shoot">DISPARAR ⚽</button></div>

<div class="overlay" id="intro"><div class="card"><div class="kicker">FOOTBALL CHALLENGE</div><div class="badge">⚽</div><h1>ULTIMATE GOAL</h1><p>Supera al portero y desbloquea tu recompensa.</p><p><b>Recompensa: 100 Tickets Draft</b></p><button onclick="start()">EMPEZAR</button></div></div>

<div class="overlay hidden" id="reward"><div class="card"><div class="kicker">REWARD UNLOCKED</div><div class="badge">🏆</div><div class="rewardTitle">¡GOLAZO!</div><div class="amount">+100 🎟️</div><p>Tu código de recompensa</p><div class="code" id="code"></div><div class="qr" id="qr"></div><p class="note">QR y código generados para esta partida.</p><button onclick="start()">JUGAR DE NUEVO</button></div></div>
</div>

<script>
let playing=false,tickets=0;
const $=id=>document.getElementById(id);
function placeTarget(){
 const p=[["10%","15%"],["47%","12%"],["78%","17%"],["23%","57%"],["65%","55%"]][Math.floor(Math.random()*5)];
 $("target").style.left=p[0];$("target").style.top=p[1];
}
function start(){
 $("intro").classList.add("hidden");$("reward").classList.add("hidden");playing=true;
 $("shoot").disabled=false;$("target").style.display="block";$("keeper").style.left="50%";
 $("ball").style.left="50%";$("ball").style.bottom="14%";$("ball").style.top="auto";$("ball").style.transform="translateX(-50%)";
 $("tip").textContent="¡Apunta al objetivo y dispara!";placeTarget();
}
$("shoot").onclick=()=>{
 if(!playing)return;playing=false;$("shoot").disabled=true;
 const r=$("target").getBoundingClientRect(),g=$(".app").getBoundingClientRect();
 $("ball").style.left=(r.left+r.width/2-g.left)+"px";$("ball").style.top=(r.top+r.height/2-g.top)+"px";$("ball").style.bottom="auto";$("ball").style.transform="translate(-50%,-50%) scale(.55)";
 setTimeout(()=>{$("keeper").style.left=["20%","50%","80%"][Math.floor(Math.random()*3)]},170);
 setTimeout(()=>{
  $("target").style.display="none";
  if(Math.random()>.28){
   tickets+=100;$("tickets").textContent=tickets;
   const code="DRAFT-"+Math.random().toString(36).slice(2,8).toUpperCase();
   $("code").textContent=code;$("qr").innerHTML="";
   const img=new Image();img.alt="QR";img.width=164;img.height=164;
   img.src="https://api.qrserver.com/v1/create-qr-code/?size=180x180&data="+encodeURIComponent(code);
   $("qr").appendChild(img);$("reward").classList.remove("hidden");
  }else{
   $("tip").textContent="❌ ¡El portero la detuvo!";
   setTimeout(start,850);
  }
 },650);
};
</script>
</body>
</html>
